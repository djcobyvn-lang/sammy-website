<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khóa Học Thần Số Học 3 Gốc | Học Viên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #03030C; --card: rgba(6,6,20,0.72);
      --violet: #7B5EA7; --indigo: #4F6BFF; --neon: #A78BFA;
      --gold: #C9A84C; --gold2: #E8C56A; --teal: #2DD4BF;
      --text: #E8E8F0; --muted: #9898B8;
      --border: rgba(167,139,250,0.16); --border-h: rgba(167,139,250,0.42);
      --sidebar-w: 320px;
    }
    body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── TOPBAR ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.4rem 0 1rem;
      background: rgba(3,3,12,0.96); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-left { display: flex; align-items: center; gap: .75rem; }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
      border: 1.5px solid rgba(167,139,250,0.45);
      box-shadow: 0 0 10px rgba(167,139,250,0.40);
      flex-shrink: 0;
    }
    .course-label { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; color: var(--gold2); white-space: nowrap; }
    .topbar-right { display: flex; align-items: center; gap: .8rem; }
    .student-name { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    .btn-logout {
      background: transparent; border: 1px solid rgba(167,139,250,0.28);
      color: var(--muted); padding: .38rem .85rem; border-radius: 100px;
      font-size: .75rem; cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif;
      transition: border-color .25s, color .25s;
    }
    .btn-logout:hover { border-color: var(--neon); color: var(--text); }

    /* ── LAYOUT ── */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
      padding-top: 60px;
      position: relative; z-index: 1;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      position: sticky; top: 60px;
      height: calc(100vh - 60px); align-self: start;
      background: rgba(5,5,16,0.97); border-right: 1px solid var(--border);
      overflow-y: auto; z-index: 10;
      scrollbar-width: thin; scrollbar-color: rgba(167,139,250,0.18) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.18); border-radius: 4px; }

    .sidebar-header {
      padding: 1.2rem 1.2rem .8rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title { font-size: .65rem; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); margin-bottom: .6rem; }
    .progress-mini { height: 4px; background: rgba(167,139,250,0.12); border-radius: 100px; overflow: hidden; }
    .progress-mini-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--teal)); border-radius: 100px; width: 0%; transition: width .5s; }
    .progress-mini-label { font-size: .72rem; color: var(--muted); margin-top: .4rem; display: flex; justify-content: space-between; }

    /* Chapter accordion */
    .chapter { border-bottom: 1px solid rgba(167,139,250,0.07); }
    .chapter-btn {
      width: 100%; display: flex; align-items: center; gap: .7rem;
      padding: .85rem 1.1rem; cursor: pointer; background: transparent; border: none;
      text-align: left; transition: background .2s; color: var(--text);
    }
    .chapter-btn:hover { background: rgba(167,139,250,0.05); }
    .chapter-btn.open { background: rgba(167,139,250,0.06); }
    .ch-num {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .65rem; font-weight: 700; font-family: 'Be Vietnam Pro', sans-serif;
      background: rgba(167,139,250,0.12); color: var(--neon);
      border: 1px solid rgba(167,139,250,0.20);
    }
    .ch-info { flex: 1; min-width: 0; }
    .ch-name { font-size: .82rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch-count { font-size: .68rem; color: var(--muted); margin-top: .1rem; }
    .ch-arrow { flex-shrink: 0; font-size: .7rem; color: var(--muted); transition: transform .25s; }
    .chapter-btn.open .ch-arrow { transform: rotate(180deg); }

    .lesson-list { display: none; padding: .3rem 0 .5rem; }
    .lesson-list.open { display: block; }
    .lesson-btn {
      width: 100%; display: flex; align-items: center; gap: .65rem;
      padding: .6rem 1.1rem .6rem 2.6rem; cursor: pointer;
      background: transparent; border: none; border-left: 2px solid transparent;
      text-align: left; transition: background .2s, border-color .2s; color: var(--muted);
      font-family: 'Be Vietnam Pro', sans-serif;
    }
    .lesson-btn:hover { background: rgba(167,139,250,0.05); color: var(--text); }
    .lesson-btn.active { color: var(--gold2); border-left-color: var(--gold2); background: rgba(201,168,76,0.05); }
    .lesson-btn.done { opacity: .6; }
    .lesson-btn.done .lsn-icon::after { content: '✓'; }
    .lsn-icon {
      width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .62rem; background: rgba(167,139,250,0.08);
      color: var(--neon); border: 1px solid rgba(167,139,250,0.15);
    }
    .lsn-title { font-size: .8rem; line-height: 1.4; }
    .lsn-dur { font-size: .65rem; color: var(--muted); margin-top: .1rem; white-space: nowrap; }

    /* ── MAIN CONTENT ── */
    .main { padding: 1.6rem 2rem 3rem; }

    /* Video player */
    .player-wrap {
      background: #000; border-radius: 16px; overflow: hidden;
      position: relative; padding-top: 56.25%; /* 16:9 */
      border: 1px solid var(--border); margin-bottom: 1.4rem;
    }
    .player-wrap iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: none;
    }
    /* iOS Safari fix */
    .player-wrap iframe { -webkit-overflow-scrolling: touch; }
    .player-placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .8rem;
      background: rgba(6,6,20,0.85);
    }
    .player-placeholder .play-ic { font-size: 3.5rem; opacity: .35; }
    .player-placeholder p { font-size: .9rem; color: var(--muted); }

    /* Lesson info */
    .lesson-info { margin-bottom: 1.4rem; }
    .lesson-chapter-tag { font-size: .65rem; text-transform: uppercase; letter-spacing: .14em; color: var(--neon); margin-bottom: .4rem; display: block; }
    .lesson-title { font-family: 'Cormorant Garamond', serif; font-size: 1.55rem; font-weight: 600; color: var(--text); margin-bottom: .5rem; }
    .lesson-meta { display: flex; align-items: center; gap: 1rem; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
    .lesson-meta span { display: flex; align-items: center; gap: .3rem; }

    /* Nav between lessons */
    .lesson-nav { display: flex; gap: .8rem; margin-top: 1.2rem; flex-wrap: wrap; }
    .btn-nav {
      display: inline-flex; align-items: center; gap: .4rem;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: .6rem 1.2rem; border-radius: 100px;
      font-size: .82rem; cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif;
      transition: border-color .25s, background .25s; text-decoration: none;
    }
    .btn-nav:hover { border-color: var(--neon); background: rgba(167,139,250,0.08); }
    .btn-nav.done-btn {
      background: linear-gradient(135deg, rgba(45,212,191,0.15), rgba(45,212,191,0.08));
      border-color: rgba(45,212,191,0.35); color: var(--teal);
    }
    .btn-nav.done-btn:hover { background: rgba(45,212,191,0.22); }

    /* Welcome screen (no lesson selected) */
    .welcome-screen {
      background: var(--card); backdrop-filter: blur(14px);
      border: 1px solid rgba(201,168,76,0.24); border-radius: 20px;
      padding: 2.2rem 2.4rem; position: relative; overflow: hidden;
    }
    .welcome-screen::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--violet), var(--teal));
    }
    .welcome-screen h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; color: var(--gold2); margin-bottom: .5rem; }
    .welcome-screen p { font-size: .88rem; color: var(--muted); line-height: 1.85; }
    .module-overview { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-top: 1.6rem; }
    .mo-card {
      background: rgba(6,6,20,0.60); border: 1px solid var(--border); border-radius: 14px;
      padding: 1.1rem; cursor: pointer; transition: border-color .25s, transform .25s;
    }
    .mo-card:hover { border-color: var(--border-h); transform: translateY(-3px); }
    .mo-tag { font-size: .62rem; text-transform: uppercase; letter-spacing: .14em; display: block; margin-bottom: .3rem; }
    .mo-name { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; color: var(--text); }
    .mo-count { font-size: .72rem; color: var(--muted); margin-top: .25rem; }

    /* Loading */
    #loading { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
    .spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(167,139,250,0.18); border-top-color: var(--neon); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: .85rem; color: var(--muted); }

    /* ── MOBILE PLAYLIST TOGGLE ── */
    .mobile-playlist-btn {
      display: none; width: 100%; padding: .85rem 1.2rem;
      background: rgba(6,6,20,0.90); border: none; border-bottom: 1px solid var(--border);
      color: var(--text); font-family: 'Be Vietnam Pro', sans-serif;
      font-size: .88rem; font-weight: 600; cursor: pointer;
      justify-content: space-between; align-items: center;
      position: sticky; top: 60px; z-index: 50;
    }
    .mobile-playlist-btn .mpb-arrow { transition: transform .25s; font-size: .7rem; }
    .mobile-playlist-btn.open .mpb-arrow { transform: rotate(180deg); }

    /* Mobile */
    @media (max-width: 860px) {
      :root { --sidebar-w: 240px; }
    }
    @media (max-width: 680px) {
      /* Stack: main (video) on top, sidebar below */
      .layout { display: flex; flex-direction: column; }

      /* Video area comes first */
      .main { order: 1; padding: .8rem .85rem 1.5rem; }

      /* Playlist toggle button visible */
      .mobile-playlist-btn { display: flex; order: 2; }

      /* Sidebar below, hidden by default */
      .sidebar {
        order: 3; position: relative; top: 0;
        width: 100%; height: auto; max-height: 0;
        overflow: hidden; border-right: none;
        border-top: 1px solid var(--border);
        transition: max-height .35s ease;
      }
      .sidebar.mobile-open { max-height: 9999px; }

      .module-overview { grid-template-columns: 1fr; }
      .lesson-title { font-size: 1.15rem; }
      .player-wrap { border-radius: 10px; margin-bottom: 1rem; }
    }
  </style>
  <!-- Vercel Analytics + Speed Insights -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Đang kiểm tra quyền truy cập...</p></div>
<canvas id="starfield"></canvas>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <img src="sammy%20logo.jpg" alt="Sammy" class="logo-mark">
    <span class="course-label">Thần Số Học 3 Gốc</span>
  </div>
  <div class="topbar-right">
    <span class="student-name" id="studentName"></span>
    <button class="btn-logout" onclick="logout()">Đăng Xuất</button>
  </div>
</div>

<div class="layout" id="mainLayout" style="display:none;">

  <!-- MOBILE: toggle playlist button (hidden on desktop) -->
  <button class="mobile-playlist-btn" id="playlistToggle" onclick="togglePlaylist()">
    <span>📋 Danh Sách Bài Học</span>

  <!-- SIDEBAR -->

  <!-- MAIN -->
  <main class="main" id="mainContent">
    <!-- Welcome shown by default -->
    <div id="welcomeView">
      <div class="welcome-screen">
        <h2 id="welcomeTitle">Chào mừng trở lại! 🌟</h2>
        <p>Bạn đang trong hành trình <strong style="color:var(--gold2);">Thần Số Học 3 Gốc</strong>. Chọn một chương bên trái để bắt đầu bài học.</p>
        <div class="module-overview" id="moduleOverview"><!-- rendered by JS --></div>
      </div>
    </div>

    <!-- Video view (hidden until lesson selected) -->
    <div id="videoView" style="display:none;">
      <div class="lesson-info">
        <span class="lesson-chapter-tag" id="lessonChapterTag"></span>
        <div class="lesson-title" id="lessonTitle">—</div>
        <div class="lesson-meta" id="lessonMeta"></div>
      </div>
      <div class="player-wrap" id="playerWrap">
        <div class="player-placeholder" id="playerPlaceholder">
          <span class="play-ic">▶</span>
          <p>Đang tải video...</p>
        </div>
        <iframe id="videoIframe" src="" allowfullscreen

          playsinline webkit-playsinline
          style="display:none;"></iframe>
      </div>
      <div class="lesson-nav" id="lessonNav"></div>
    </div>
  </main>
</div>

/* ─── FLATTEN lessons for prev/next ─── */
const ALL_LESSONS = [];
CHAPTERS.forEach(ch => ch.lessons.forEach(l => ALL_LESSONS.push({ ...l, chapterId: ch.id, chapterTitle: ch.title })));
const TOTAL = ALL_LESSONS.length;

let currentVideoId = null;
let done = JSON.parse(localStorage.getItem('sammy_progress_v2') || '[]');

/* ─── BUILD SIDEBAR ─── */
function buildSidebar() {
  const container = document.getElementById('chapterList');
  container.innerHTML = CHAPTERS.map((ch, ci) => `
    <div class="chapter" id="ch-${ch.id}">
      <button class="chapter-btn" onclick="toggleChapter(${ch.id})">
        <span class="ch-num">${String(ch.id).padStart(2,'0')}</span>
        <span class="ch-info">
          <span class="ch-name">${ch.title.replace(/^Chương \d+: /,'')}</span>
          <span class="ch-count">${ch.lessons.length} bài · ${ch.lessons.filter(l=>done.includes(l.id)).length} hoàn thành</span>
        </span>
        <span class="ch-arrow">▾</span>
      </button>
      <ul class="lesson-list" id="cl-${ch.id}">
        ${ch.lessons.map((l,li) => `
          <li>
            <button class="lesson-btn ${done.includes(l.id)?'done':''}" id="lb-${l.id}" onclick="playLesson('${l.id}')">
              <span class="lsn-icon">${done.includes(l.id)?'✓':li+1}</span>
              <span>
                <span class="lsn-title">${l.title}</span>
                ${l.duration ? `<span class="lsn-dur">⏱ ${l.duration}</span>` : ''}
              </span>
            </button>
          </li>`).join('')}
      </ul>
    </div>`).join('');
}

function toggleChapter(id) {
  const btn = document.querySelector(`#ch-${id} .chapter-btn`);
  const list = document.getElementById(`cl-${id}`);
  const isOpen = list.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  list.classList.toggle('open', !isOpen);
}

/* ─── BUILD MODULE OVERVIEW ─── */
function buildOverview() {
  const MODULES = [
    {
      label: 'Module 01', color: 'var(--gold2)', border: 'rgba(201,168,76,0.28)',
      name: 'Nền Tảng & Công Cụ',

      desc: 'Số Chủ Đạo, Vận Mệnh, Tâm Hồn, Tính Cách, Biểu Đồ, Ốc Đảo',
      chs: [4,5,6,7,8,9], startCh: 4
    },
    {

  document.getElementById('moduleOverview').innerHTML = MODULES.map(m => {
    const total = m.chs.reduce((a,cId) => {

      return a + (ch ? ch.lessons.length : 0);
    }, 0);
    return `<div class="mo-card" style="border-color:${m.border};" onclick="toggleChapter(${m.startCh})">

      <div style="font-size:.7rem;color:var(--muted);line-height:1.5;">${m.desc}</div>
    </div>`;
  }).join('');
}

/* ─── PLAY LESSON ─── */
function playLesson(videoId) {
  currentVideoId = videoId;
  const lesson = ALL_LESSONS.find(l => l.id === videoId);
  if (!lesson) return;

  /* Show video view */
  document.getElementById('welcomeView').style.display = 'none';
  document.getElementById('videoView').style.display = 'block';

  /* Mobile: đóng playlist và scroll lên player */
  if (window.innerWidth <= 680) {
    const sidebar = document.getElementById('sidebar');
    const btn     = document.getElementById('playlistToggle');
    sidebar.classList.remove('mobile-open');
    btn.classList.remove('open');
    document.getElementById('mainContent').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* Update info */
  document.getElementById('lessonChapterTag').textContent = lesson.chapterTitle;
  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonMeta').innerHTML = lesson.duration
    ? `<span>⏱ ${lesson.duration}</span>` : '';

  /* Load iframe */
  const iframe = document.getElementById('videoIframe');
  const placeholder = document.getElementById('playerPlaceholder');
  placeholder.style.display = 'flex';
  iframe.style.display = 'none';
  const src = `https://iframe.mediadelivery.net/embed/${BUNNY_LIB_ID}/${videoId}?autoplay=true&preload=true`;
  iframe.onload = () => { placeholder.style.display = 'none'; iframe.style.display = 'block'; };
  iframe.src = src;

  /* Highlight active in sidebar */
  document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById(`lb-${videoId}`);
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.scrollIntoView({ block: 'nearest' });
  }

  /* Mark as done */
  if (!done.includes(videoId)) {
    done.push(videoId);
    localStorage.setItem('sammy_progress_v2', JSON.stringify(done));
    updateProgress();
    if (activeBtn) { activeBtn.classList.add('done'); activeBtn.querySelector('.lsn-icon').textContent = '✓'; }
  }

  /* Nav buttons */
  const idx = ALL_LESSONS.findIndex(l => l.id === videoId);
  const prev = idx > 0 ? ALL_LESSONS[idx-1] : null;
  const next = idx < ALL_LESSONS.length-1 ? ALL_LESSONS[idx+1] : null;
  document.getElementById('lessonNav').innerHTML = `
    ${prev ? `<button class="btn-nav" onclick="playLesson('${prev.id}')">← ${prev.title}</button>` : ''}
    ${next ? `<button class="btn-nav" onclick="playLesson('${next.id}')">Bài tiếp: ${next.title} →</button>` : '<span style="font-size:.82rem;color:var(--teal);">🎉 Bạn đã hoàn thành tất cả!</span>'}
  `;

  /* Open chapter in sidebar */
  const ch = CHAPTERS.find(c => c.id === lesson.chapterId);
  if (ch) {
    const list = document.getElementById(`cl-${ch.id}`);
    if (!list.classList.contains('open')) toggleChapter(ch.id);
  }
}

function updateProgress() {
  const pct = Math.round((done.length / TOTAL) * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = `${done.length} / ${TOTAL} bài`;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
}

/* ─── AUTH ─── */
const TOKEN = localStorage.getItem('sammy_token');
const NAME  = localStorage.getItem('sammy_name') || '';

async function checkAccess() {
  if (!TOKEN) { redirect(); return; }
  try {
    const res = await fetch('/api/course/verify', { headers: { Authorization: `Bearer ${TOKEN}` } });
    if (!res.ok) { redirect(); return; }
    const data = await res.json();
    if (!data.access) { redirect(); return; }
    showApp(data.name);
  } catch {
    if (TOKEN && NAME) showApp(NAME);
    else redirect();
  }
}

function showApp(name) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('mainLayout').style.display = window.innerWidth <= 680 ? 'flex' : 'grid';
  document.getElementById('studentName').textContent = name;
  document.getElementById('welcomeTitle').textContent = `Chào mừng ${name}! 🌟`;
  buildSidebar();
  buildOverview();
  updateProgress();
}

function redirect() { window.location.href = 'hoc-vien-dang-nhap.html'; }
function logout() {
  localStorage.removeItem('sammy_token');
  localStorage.removeItem('sammy_name');
  window.location.href = 'hoc-vien-dang-nhap.html';
}

/* ─── STARFIELD ─── */
(function(){
  const c=document.getElementById('starfield'),ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  function init(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.1,o:Math.random()*.4+.1,speed:Math.random()*.016+.004,phase:Math.random()*Math.PI*2});}
  function draw(t){ctx.clearRect(0,0,W,H);stars.forEach(s=>{const tw=Math.sin(t*.001*s.speed*1000+s.phase)*.28+.72;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(220,210,255,${s.o*tw})`;ctx.fill();});requestAnimationFrame(draw);}
  resize();init();requestAnimationFrame(draw);
  window.addEventListener('resize',()=>{resize();init();});
})();

/* ── MOBILE PLAYLIST TOGGLE ── */
function togglePlaylist() {
  const sidebar = document.getElementById('sidebar');
  const btn     = document.getElementById('playlistToggle');
  const isOpen  = sidebar.classList.contains('mobile-open');
  sidebar.classList.toggle('mobile-open', !isOpen);
  btn.classList.toggle('open', !isOpen);
}

/* ── Cập nhật layout khi resize ── */
window.addEventListener('resize', () => {
  const layout = document.getElementById('mainLayout');
  if (layout && layout.style.display !== 'none') {
    layout.style.display = window.innerWidth <= 680 ? 'flex' : 'grid';
  }
});

checkAccess();
</script>
