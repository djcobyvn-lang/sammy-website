<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Đăng Nhập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04051A; --card:rgba(13,18,64,.65);
  --violet:#7B5EA7; --indigo:#4F6BFF; --teal:#2DD4BF; --neon:#A78BFA;
  --txt:#E8E8F0; --muted:#9898B8;
  --border:rgba(123,94,167,.25); --grad:linear-gradient(135deg,#7B5EA7,#4F6BFF);
}
body{
  min-height:100vh; background:var(--bg);
  font-family:'Be Vietnam Pro',sans-serif; color:var(--txt);
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; padding:1rem;
}
body::before{
  content:''; position:fixed; inset:0;
  background-image:
    radial-gradient(1px 1px at 10% 15%,rgba(167,139,250,.6) 0,transparent 0),
    radial-gradient(1px 1px at 30% 55%,rgba(255,255,255,.3) 0,transparent 0),
    radial-gradient(1px 1px at 50% 25%,rgba(167,139,250,.4) 0,transparent 0),
    radial-gradient(1px 1px at 70% 75%,rgba(255,255,255,.25) 0,transparent 0),
    radial-gradient(1px 1px at 85% 40%,rgba(45,212,191,.4) 0,transparent 0),
    radial-gradient(1px 1px at 20% 85%,rgba(255,255,255,.2) 0,transparent 0);
  pointer-events:none; z-index:0;
}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb-1{width:400px;height:400px;background:radial-gradient(circle,rgba(123,94,167,.18),transparent 70%);top:-10%;left:-10%;}
.orb-2{width:350px;height:350px;background:radial-gradient(circle,rgba(79,107,255,.14),transparent 70%);bottom:-5%;right:-5%;}

.wrap{position:relative;z-index:1;width:100%;max-width:420px;}

.brand{text-align:center;margin-bottom:2rem;}
.brand-symbol{font-size:2.2rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;margin-bottom:.5rem;}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;letter-spacing:.08em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand-sub{font-size:.75rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:.25rem;}

.card{
  background:var(--card); backdrop-filter:blur(20px);
  border:1px solid var(--border); border-radius:20px;
  padding:2.4rem 2rem;
  box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;text-align:center;margin-bottom:.4rem;color:var(--txt);}
.card-title span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card-sub{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:1.8rem;line-height:1.6;}

/* panels */
.panel{display:none;} .panel.active{display:block;}

.f-group{margin-bottom:1.2rem;}
.f-label{display:block;font-size:.75rem;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.45rem;}
.f-input{
  width:100%; background:rgba(4,5,26,.7); border:1px solid var(--border);
  border-radius:10px; padding:.75rem 1rem; color:var(--txt);
  font-family:'Be Vietnam Pro',sans-serif; font-size:.9rem; outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.f-input::placeholder{color:rgba(152,152,184,.4);}
.f-input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(167,139,250,.15);}

.btn{
  width:100%; background:var(--grad); border:none; border-radius:10px;
  padding:.85rem 1.5rem; color:#fff; font-family:'Be Vietnam Pro',sans-serif;
  font-size:.9rem; font-weight:600; cursor:pointer;
  box-shadow:0 4px 20px rgba(123,94,167,.4);
  transition:opacity .2s,box-shadow .2s,transform .15s;
}
.btn:hover{opacity:.92;box-shadow:0 6px 28px rgba(123,94,167,.6);transform:translateY(-1px);}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}

/* OTP boxes */
.otp-row{display:flex;gap:.6rem;justify-content:center;margin:1rem 0 1.5rem;}
.otp-box{
  width:48px;height:54px;text-align:center;
  background:rgba(4,5,26,.7); border:1px solid var(--border);
  border-radius:10px; color:var(--txt); font-size:1.4rem;font-weight:700;
  outline:none; transition:border-color .25s,box-shadow .25s;
  font-family:'Cormorant Garamond',serif;
}
.otp-box:focus{border-color:var(--neon);box-shadow:0 0 12px rgba(167,139,250,.22);}
.otp-box.filled{border-color:rgba(45,212,191,.45);color:var(--teal);}

.msg{margin-top:.8rem;padding:.7rem 1rem;border-radius:10px;font-size:.82rem;text-align:center;display:none;}
.msg.error  {background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.28);color:#FCA5A5;display:block;}
.msg.success{background:rgba(45,212,191,.10);border:1px solid rgba(45,212,191,.28);color:var(--teal);display:block;}

.resend-row{text-align:center;margin-top:1rem;font-size:.8rem;color:var(--muted);}
.resend-btn{background:none;border:none;cursor:pointer;color:var(--neon);font-size:.8rem;text-decoration:underline;padding:0;font-family:'Be Vietnam Pro',sans-serif;}
.resend-btn:disabled{color:var(--muted);text-decoration:none;cursor:default;}

.email-shown{text-align:center;margin-bottom:1.2rem;font-size:.85rem;color:var(--muted);}
.email-shown strong{color:var(--txt);}

.note{display:flex;align-items:center;gap:.5rem;justify-content:center;font-size:.72rem;color:var(--muted);margin-top:1.4rem;}
.footer{text-align:center;margin-top:1.5rem;font-size:.75rem;color:var(--muted);}
.footer a{color:var(--neon);text-decoration:none;}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s ease;}
@media(max-width:480px){.f-input{font-size:16px;min-height:44px;}.btn{min-height:48px;}}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrap">
  <div class="brand">
    <span class="brand-symbol">✦</span>
    <div class="brand-name">SAMMY TRƯƠNG</div>
    <div class="brand-sub">Admin Portal</div>
  </div>

  <div class="card" id="card">
    <h1 class="card-title">Đăng Nhập <span>Quản Trị</span></h1>

    <!-- PANEL 1: Nhập email -->
    <div class="panel active" id="p1">
      <p class="card-sub">Nhập email quản trị để nhận mã OTP xác thực.</p>
      <div class="f-group">
        <label class="f-label">Email quản trị</label>
        <input class="f-input" type="email" id="adminEmail" placeholder="admin@email.com" autocomplete="email" />
      </div>
      <button class="btn" id="sendBtn" onclick="sendOTP()">✦ Gửi Mã OTP</button>
      <div class="msg" id="msg1"></div>
    </div>

    <!-- PANEL 2: Nhập OTP -->
    <div class="panel" id="p2">
      <p class="card-sub">Mã OTP đã được gửi đến email của bạn.</p>
      <div class="email-shown">Kiểm tra hộp thư: <strong id="emailShown"></strong></div>
      <div class="otp-row" id="otpRow">
        <input class="otp-box" maxlength="1" inputmode="numeric" />
        <input class="otp-box" maxlength="1" inputmode="numeric" />
        <input class="otp-box" maxlength="1" inputmode="numeric" />
        <input class="otp-box" maxlength="1" inputmode="numeric" />
        <input class="otp-box" maxlength="1" inputmode="numeric" />
        <input class="otp-box" maxlength="1" inputmode="numeric" />
      </div>
      <button class="btn" id="verifyBtn" onclick="verifyOTP()">✓ Xác Nhận</button>
      <div class="msg" id="msg2"></div>
      <div class="resend-row">
        Chưa nhận được? <button class="resend-btn" id="resendBtn" onclick="resendOTP()" disabled>Gửi lại (<span id="cd">60</span>s)</button>
      </div>
    </div>

  </div>

  <div class="note">🔐 Kết nối được mã hóa. Chỉ dành cho quản trị viên.</div>
  <div class="footer"><a href="index.html">← Về trang chủ</a></div>
</div>

<script>
const ADMIN_EMAILS = ['sammynumerology@gmail.com'];
let currentEmail = '', cdTimer = null;

async function sendOTP() {
  const email = document.getElementById('adminEmail').value.trim().toLowerCase();
  const msg   = document.getElementById('msg1');
  const btn   = document.getElementById('sendBtn');
  msg.className = 'msg';

  if (!email) { showMsg('msg1','Vui lòng nhập email.','error'); return; }
  if (!ADMIN_EMAILS.includes(email)) { showMsg('msg1','Email không có quyền truy cập admin.','error'); return; }

  btn.disabled = true; btn.textContent = 'Đang gửi...';
  try {
    const res = await fetch('/api/auth/send-otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const d = await res.json();
    if (!res.ok) { showMsg('msg1', d.error||'Không gửi được OTP.','error'); btn.disabled=false; btn.textContent='✦ Gửi Mã OTP'; return; }
    currentEmail = email;
    document.getElementById('emailShown').textContent = email;
    document.getElementById('p1').classList.remove('active');
    document.getElementById('p2').classList.add('active');
    startCountdown();
    document.querySelector('.otp-box').focus();
  } catch {
    showMsg('msg1','Lỗi kết nối. Thử lại.','error');
    btn.disabled=false; btn.textContent='✦ Gửi Mã OTP';
  }
}

async function verifyOTP() {
  const boxes = document.querySelectorAll('.otp-box');
  const otp   = Array.from(boxes).map(b=>b.value).join('');
  const btn   = document.getElementById('verifyBtn');
  if (otp.length < 6) { showMsg('msg2','Vui lòng nhập đủ 6 số.','error'); return; }

  btn.disabled = true; btn.textContent = 'Đang xác nhận...';
  try {
    const res = await fetch('/api/auth/verify-otp', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: currentEmail, otp })
    });
    const d = await res.json();
    if (!res.ok) {
      showMsg('msg2', d.error||'Mã không đúng hoặc đã hết hạn.','error');
      document.getElementById('card').classList.add('shake');
      setTimeout(()=>document.getElementById('card').classList.remove('shake'),400);
      btn.disabled=false; btn.textContent='✓ Xác Nhận'; return;
    }
    localStorage.setItem('admin_auth','1');
    localStorage.setItem('admin_email', currentEmail);
    if (d.token) localStorage.setItem('admin_token', d.token);
    btn.textContent = '✓ Thành công!';
    setTimeout(()=> window.location.href='admin.html', 600);
  } catch {
    showMsg('msg2','Lỗi kết nối.','error');
    btn.disabled=false; btn.textContent='✓ Xác Nhận';
  }
}

async function resendOTP() {
  await fetch('/api/auth/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:currentEmail})});
  startCountdown();
  showMsg('msg2','Đã gửi lại mã OTP.','success');
}

function startCountdown() {
  clearInterval(cdTimer);
  let s = 60;
  document.getElementById('cd').textContent = s;
  document.getElementById('resendBtn').disabled = true;
  cdTimer = setInterval(()=>{
    s--;
    document.getElementById('cd').textContent = s;
    if (s <= 0) { clearInterval(cdTimer); document.getElementById('resendBtn').disabled=false; document.getElementById('resendBtn').textContent='Gửi lại'; }
  },1000);
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text; el.className = 'msg '+type;
}

// OTP auto-advance
document.querySelectorAll('.otp-box').forEach((box,i,arr)=>{
  box.addEventListener('input',()=>{
    box.classList.toggle('filled',box.value!=='');
    if(box.value&&i<arr.length-1) arr[i+1].focus();
  });
  box.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&!box.value&&i>0) arr[i-1].focus();
  });
  box.addEventListener('paste',e=>{
    const txt=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
    arr.forEach((b,j)=>{ b.value=txt[j]||''; b.classList.toggle('filled',!!b.value); });
    e.preventDefault();
  });
});

// Enter key
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(document.getElementById('p1').classList.contains('active')) sendOTP();
  else verifyOTP();
});
</script>
</body>
</html>
